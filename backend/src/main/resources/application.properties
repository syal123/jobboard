spring.application.name=backend

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Skip Hibernate opening a connection at boot just to read DB metadata (dialect is already fixed above)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

jwt.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.main.banner-mode=off

# Reduce cold-start time for Vercel
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy

# Do not block application startup while opening the initial DB connection
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3