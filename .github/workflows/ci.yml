name: CI

on:
 push:
   branches: [main]
 pull_request:
   branches: [main]

jobs:
   backend_test:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4

       - name: Set up JDK 17
         uses: actions/setup-java@v4
         with:
           java-version: '17'
           distribution: 'temurin'
       - name: Run backend tests
         working-directory: backend
         run: ./mvnw clean test
   frontend-build:
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with: 
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci 
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build

   deploy-backend:
     needs: backend_test
     if: github.ref == 'refs/heads/main' && github.event_name == 'push'
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4

       - name: Install Vercel CLI
         run: npm install --global vercel@latest

       - name: Deploy backend to Vercel (Production)
         working-directory: backend
         run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
         env:
           VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
           VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}

   deploy-frontend:
     needs: frontend-build
     if: github.ref == 'refs/heads/main' && github.event_name == 'push'
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4

       - name: Install Vercel CLI
         run: npm install --global vercel@latest

       - name: Pull Vercel environment
         working-directory: frontend
         run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
         env:
           VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
           VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}

       - name: Build frontend for Vercel
         working-directory: frontend
         run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

       - name: Deploy frontend to Vercel (Production)
         working-directory: frontend
         run: vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
